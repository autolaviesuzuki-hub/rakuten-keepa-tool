<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>楽天 × Keepa 照合ツール</title>
  <script type="module">
    import { runFullPipeline, runBrandPipeline } from "./main.js";

    // 型番検索ボタン
    window.searchByModel = function () {
      const model = document.getElementById("model").value.trim();

      const entry = {
        brand: document.getElementById("brand").value.trim(),
        category: document.getElementById("category").value.trim(),
        gender: document.getElementById("gender").value.trim(),
        model: model
      };

      runFullPipeline(entry);
    };

    // ブランド検索ボタン
    window.searchByBrand = function () {
      const brand = document.getElementById("brand").value.trim();
      runBrandPipeline(brand);
    };
  </script>
</head>

<body>

  <h2>楽天 × Keepa 照合ツール</h2>

  <div>
    <label>ブランド名：</label>
    <input id="brand" type="text" placeholder="例：ナイキ">
  </div>

  <div>
    <label>カテゴリ：</label>
    <input id="category" type="text" placeholder="例：スニーカー">
  </div>

  <div>
    <label>性別：</label>
    <input id="gender" type="text" placeholder="例：メンズ">
  </div>

  <div>
    <label>型番：</label>
    <input id="model" type="text" placeholder="例：DC1460-007">
  </div>

  <hr>

  <!-- 型番検索モード -->
  <button onclick="searchByModel()">型番検索（runFullPipeline）</button>

  <!-- ブランド検索モード -->
  <button onclick="searchByBrand()">ブランド検索（runBrandPipeline）</button>

</body>
</html>
