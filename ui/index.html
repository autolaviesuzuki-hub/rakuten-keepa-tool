<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Rakuten Keepa Tool</title>
</head>
<body>
  <h1>Rakuten × Keepa 統合検索</h1>

  <button id="run">統合検索を実行</button>
  <pre id="log"></pre>

  <script type="module">
    import { runFullPipeline } from "../src/main.js";

    document.getElementById("run").addEventListener("click", async () => {
      const log = document.getElementById("log");

      // ★ ここを自由に変更（ブランド・カテゴリ・性別・型番）
      const modelEntry = {
        brand: "ナイキ",
        category: "スニーカー",
        gender: "メンズ",
        model: "DC1460-007"   // ← 型番を入れると精度が上がる
      };

      try {
        const results = await runFullPipeline(modelEntry);

        // ★ candidates ではなく results を表示する（重要）
        log.textContent = JSON.stringify(results, null, 2);

      } catch (e) {
        log.textContent = "エラー: " + e.message;
        console.error(e);
      }
    });
  </script>
</body>
</html>
